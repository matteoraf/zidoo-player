# ------------------------------------
# Zidoo Z9X 8K - Navigation (D-Pad & Menus)
# ------------------------------------
zidoo_up_control:
  alias: 'Zidoo: Up'
  icon: mdi:arrow-up
  sequence:
  - action: remote.send_command
    target:
      entity_id: remote.z9x_8k
    data:
      command: Key.Up

